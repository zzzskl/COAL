<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COAL Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <button id="hamburger-btn" aria-label="Toggle sidebar" title="Toggle sidebar" aria-expanded="false">☰</button>
    <div id="sidebar-overlay"></div>

    <aside id="sidebar">
      <!-- Section: Configuration (default expanded) -->
      <button class="section-header" data-section="config">
        Configuration <span class="section-arrow">▼</span>
      </button>
      <div class="section-content" id="section-config">
        <label>Model</label>
        <select id="cfg-model">
          <option value="deepseek-v4-flash">deepseek-v4-flash</option>
          <option value="deepseek-v4-pro">deepseek-v4-pro</option>
        </select>

        <label>System Prompt</label>
        <textarea id="cfg-system" rows="3" placeholder="Optional system prompt..."></textarea>

        <label>Temperature: <span id="val-temp">0.7</span></label>
        <input type="range" id="cfg-temperature" min="0" max="2" step="0.1" value="0.7">

        <label>Max Tokens</label>
        <input type="number" id="cfg-maxTokens" value="4096" min="1" max="65536">

        <label>Top P: <span id="val-topP">1</span></label>
        <input type="range" id="cfg-topP" min="0" max="1" step="0.05" value="1">

        <label>
          <input type="checkbox" id="cfg-thinking-toggle"> Enable Thinking
        </label>
        <select id="cfg-thinking-effort" style="display:none">
          <option value="high">Effort: High</option>
          <option value="max">Effort: Max</option>
        </select>

        <label>Stop Sequences (comma-separated)</label>
        <input type="text" id="cfg-stop" placeholder="e.g. END, STOP">
      </div>

      <hr class="section-divider">

      <!-- Section: Tools -->
      <button class="section-header collapsed" data-section="tools">
        Tools <span class="section-arrow">▼</span>
      </button>
      <div class="section-content collapsed" id="section-tools">
        <div id="tools-list"></div>
        <button id="tools-add-btn">+ Add Tool</button>
      </div>

      <hr class="section-divider">

      <!-- Section: Executor -->
      <button class="section-header collapsed" data-section="executor">
        Executor <span class="section-arrow">▼</span>
      </button>
      <div class="section-content collapsed" id="section-executor">
        <button id="exec-run-btn">Execute Pending</button>
        <div id="exec-result"></div>
      </div>

      <hr class="section-divider">

      <!-- Section: Context Builder -->
      <button class="section-header collapsed" data-section="context">
        Context Builder <span class="section-arrow">▼</span>
      </button>
      <div class="section-content collapsed" id="section-context">
        <div id="ctx-save-row">
          <input type="text" id="ctx-filename" placeholder="context name">
          <button id="ctx-save-btn">Save</button>
          <select id="ctx-load-select"></select>
          <button id="ctx-load-btn">Load</button>
          <button id="ctx-del-file-btn" title="Delete saved context">🗑</button>
        </div>
        <div id="ctx-list"></div>
        <div id="ctx-add-form">
          <select id="ctx-add-role">
            <option value="system">system</option>
            <option value="user" selected>user</option>
            <option value="assistant">assistant</option>
            <option value="tool">tool</option>
          </select>
          <input type="text" id="ctx-add-tool-call-id" placeholder="tool_call_id (for tool role)" style="display:none">
          <textarea id="ctx-add-tool-calls" placeholder='tool_calls JSON (for assistant role)' style="display:none" rows="3"></textarea>
          <textarea id="ctx-add-content" rows="2" placeholder="Message content..."></textarea>
          <button id="ctx-add-btn">Add Message</button>
        </div>
      </div>

      <hr class="section-divider">

      <!-- Section: Logs -->
      <button class="section-header collapsed" data-section="logs">
        Logs <span class="section-arrow">▼</span>
      </button>
      <div class="section-content collapsed" id="section-logs">
        <div class="logs-toolbar">
          <button id="logs-snap-btn" class="logs-snap-btn">Snapshot</button>
          <button id="logs-pause-btn" class="logs-pause-btn" title="Pause auto-refresh">⏸</button>
          <button id="logs-clear-btn" class="logs-clear">Clear</button>
        </div>
        <div id="logs-list"></div>
      </div>
    </aside>

    <!-- Right Panel: Chat -->
    <main id="chat-area">
      <button id="scroll-bottom-btn" title="Scroll to bottom">↓</button>
      <div id="messages"></div>
      <div id="input-row">
        <textarea id="input" rows="2" placeholder="Type your message... (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send-btn">Send</button>
        <button id="clear-btn">Clear</button>
        <span id="msg-count">0 messages</span>
        <div class="kb-hints"><kbd>Enter</kbd> Send &nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> Newline</div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
