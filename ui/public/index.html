<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COAL Chat</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">

    <!-- ═══ TopBar ═══════════════════════════════════════════ -->
    <header id="topbar">
      <!-- User -->
      <div class="topbar-item">
        <label for="user-name" class="topbar-label">User</label>
        <input type="text" id="user-name" class="topbar-input" value="default" placeholder="username">
      </div>

      <div class="topbar-sep"></div>

      <!-- Context switcher -->
      <div class="topbar-item">
        <label class="topbar-label">Chat</label>
        <select id="ctx-switcher" class="topbar-select"></select>
        <button id="ctx-modal-btn" class="topbar-icon-btn" title="Manage conversations">▴</button>
      </div>

      <div class="topbar-sep"></div>

      <!-- Config compact -->
      <div class="topbar-item" id="topbar-config">
        <!-- populated by main.js -->
      </div>
      <button id="cfg-modal-btn" class="topbar-icon-btn" title="Manage configs">⚙</button>

      <div class="topbar-sep"></div>

      <!-- Tools badge -->
      <span id="tools-badge" class="topbar-badge" title="Tools">🔧0</span>

      <div class="topbar-sep"></div>

      <!-- Panel buttons: open modals for each panel -->
      <button id="exec-btn" class="topbar-icon-btn" title="Executor">▶</button>
      <button id="logs-btn" class="topbar-icon-btn" title="Logs">📋</button>
      <button id="ctx-builder-btn" class="topbar-icon-btn" title="Context Builder">✎</button>
    </header>

    <div class="app-body">
    <!-- ═══ Main: MessageList ═══════════════════════════════ -->
    <main id="chat-main">
      <!-- MessageList rendered here by main.js -->
    </main>
    </div>

    <!-- ═══ Modal overlay ══════════════════════════════════ -->
    <div id="modal-overlay">
      <div id="modal-container">
        <div id="modal-body"></div>
      </div>
    </div>

  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
