<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COAL UI Component Tests</title>
  <link rel="stylesheet" href="/css/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e; color: #e0e0e0; padding: 24px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
    #summary {
      display: flex; gap: 16px; margin-bottom: 20px;
      padding: 12px 16px; background: #16213e; border-radius: 8px;
    }
    .summary-pass { color: #4caf50; }
    .summary-fail { color: #f44336; }
    .summary-total { color: #e0e0e0; }
    .test-row {
      padding: 8px 12px; margin-bottom: 4px; border-radius: 4px;
      font-size: 13px; font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    .test-pass { background: #1b3a2a; color: #81c784; }
    .test-fail { background: #3a1b1b; color: #ef9a9a; }
    .test-error {
      margin-top: 6px; padding: 8px 12px; background: #2a1515;
      border-radius: 4px; font-size: 12px; white-space: pre-wrap;
      color: #ef9a9a; border-left: 3px solid #f44336;
    }
    .test-duration { float: right; font-size: 11px; opacity: 0.6; }
    #status {
      display: inline-block; padding: 4px 12px; border-radius: 4px;
      font-size: 14px; font-weight: 600; margin-bottom: 16px;
    }
    .status-running { background: #f57f17; color: #fff; }
    .status-done { background: #2e7d32; color: #fff; }
    #file-list { margin-bottom: 16px; font-size: 12px; color: #888; }
    #file-list span { display: inline-block; margin-right: 8px; padding: 2px 8px; background: #16213e; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 COAL UI Component Tests</h1>
  <p class="subtitle">In-browser test runner — real DOM environment</p>
  <div id="file-list"></div>
  <div id="status" class="status-running">⏳ Running...</div>
  <div id="summary"></div>
  <div id="test-list"></div>

  <script type="module">
    import { run } from './lib.js';

    // Dynamically discover and load test files
    const testModules = [
      './context.test.js',
      // Future: './message.test.js', './tool.test.js',
    ];

    // Show file list
    const fileList = document.getElementById('file-list');
    fileList.innerHTML = 'Files: ' + testModules.map(f => `<span>${f}</span>`).join('');

    try {
      // Load all test modules (they auto-register via test())
      for (const mod of testModules) {
        await import(mod);
      }

      const results = await run();

      const statusEl = document.getElementById('status');
      const summaryEl = document.getElementById('summary');
      const listEl = document.getElementById('test-list');

      const passed = results.filter(r => r.passed).length;
      const failed = results.filter(r => !r.passed).length;

      // Status
      statusEl.className = failed > 0 ? 'status-fail' : 'status-done';
      statusEl.textContent = failed > 0 ? '❌ Some tests failed' : '✅ All tests passed';

      // Summary
      summaryEl.innerHTML = `
        <span class="summary-total">Total: ${results.length}</span>
        <span class="summary-pass">Passed: ${passed}</span>
        <span class="summary-fail">Failed: ${failed}</span>
      `;

      // Results
      listEl.innerHTML = '';
      for (const r of results) {
        const row = document.createElement('div');
        row.className = r.passed ? 'test-row test-pass' : 'test-row test-fail';
        row.innerHTML = `
          <span>${r.passed ? '✓' : '✗'}</span>
          <span>${r.name}</span>
          <span class="test-duration">${r.duration.toFixed(1)}ms</span>
          ${r.error ? `<div class="test-error">${r.error.stack || r.error.message}</div>` : ''}
        `;
        listEl.appendChild(row);
      }
    } catch (err) {
      document.getElementById('status').textContent = '💥 Fatal error loading tests';
      document.getElementById('status').className = 'status-fail';
      document.getElementById('test-list').innerHTML =
        `<div class="test-row test-fail"><div class="test-error">${err.stack || err.message}</div></div>`;
    }
  </script>
</body>
</html>
